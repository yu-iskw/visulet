name: Live Benchmark

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Model provider adapter
        type: choice
        options:
          - openai
          - anthropic
          - gemini
          - openrouter
        default: openai
      model:
        description: Provider model id
        required: true
        type: string

concurrency:
  group: live-benchmark
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    name: Run live agent-authoring benchmark
    runs-on: ubuntu-latest
    environment: live-benchmark
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @visulet/benchmark-live... build

      - name: Run live benchmark
        env:
          OPENAI_API_KEY: ${{ inputs.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ inputs.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          GEMINI_API_KEY: ${{ inputs.provider == 'gemini' && secrets.GEMINI_API_KEY || '' }}
          GOOGLE_API_KEY: ${{ inputs.provider == 'gemini' && secrets.GOOGLE_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ inputs.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
        run: |
          pnpm --filter @visulet/benchmark-live start -- \
            --manifest benchmarks/agent-authoring/v1/manifests/live.example.json \
            --provider "$PROVIDER" \
            --model "$MODEL"

      - name: Upload report artifacts
        uses: actions/upload-artifact@ea9e01860d4a64010fa0a3b05d484a30d4d9f1e8 # v4.6.2
        with:
          name: live-benchmark-report
          path: |
            benchmarks/agent-authoring/v1/results/aggregate.json
            benchmarks/agent-authoring/v1/results/report.md
            benchmarks/agent-authoring/v1/results/candidates.jsonl
