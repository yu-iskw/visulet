# Temporary one-shot formatter for RFC 0001. This workflow is deleted after it runs.
name: Format RFC once

on:
  push:
    branches:
      - docs/visual-document-v0-rfc
    paths:
      - .github/workflows/format-rfc-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true

      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize RFC references
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/rfcs/0001-visual-document-v0.md")
          text = path.read_text()
          replacements = {
              '"https://visually.dev/schema/v0/visual-document.schema.json"':
                  '"https://raw.githubusercontent.com/yu-iskw/visually/main/schemas/v0/visual-document.schema.json"',
              '- JSON Schema Draft 2020-12: https://json-schema.org/draft/2020-12':
                  '- [JSON Schema Draft 2020-12](https://json-schema.org/draft/2020-12)',
              '- JSON Patch (RFC 6902): https://www.rfc-editor.org/rfc/rfc6902':
                  '- [JSON Patch (RFC 6902)](https://www.rfc-editor.org/rfc/rfc6902)',
              '- JSON Text Sequences (RFC 7464): https://www.rfc-editor.org/rfc/rfc7464':
                  '- [JSON Text Sequences (RFC 7464)](https://www.rfc-editor.org/rfc/rfc7464)',
              '- Apache Arrow format: https://arrow.apache.org/docs/format/Columnar.html':
                  '- [Apache Arrow format](https://arrow.apache.org/docs/format/Columnar.html)',
              '- Vega-Lite: https://vega.github.io/vega-lite/':
                  '- [Vega-Lite](https://vega.github.io/vega-lite/)',
              '- Mermaid: https://mermaid.ai/open-source/':
                  '- [Mermaid](https://mermaid.ai/open-source/)',
              '- AntV Infographic: https://github.com/antvis/Infographic':
                  '- [AntV Infographic](https://github.com/antvis/Infographic)',
              '- Flint Chart: https://github.com/microsoft/flint-chart':
                  '- [Flint Chart](https://github.com/microsoft/flint-chart)',
              '- MCP Apps: https://modelcontextprotocol.io/extensions/apps/overview':
                  '- [MCP Apps](https://modelcontextprotocol.io/extensions/apps/overview)',
              '- BPMN 2.0.2: https://www.omg.org/spec/BPMN/2.0.2/':
                  '- [BPMN 2.0.2](https://www.omg.org/spec/BPMN/2.0.2/)',
              '- UML: https://www.omg.org/spec/UML/':
                  '- [UML](https://www.omg.org/spec/UML/)',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected RFC text not found: {old}")
              text = text.replace(old, new)
          path.write_text(text)

      - name: Format changed artifacts
        run: pnpm exec prettier --write docs/rfcs/0001-visual-document-v0.md schemas/v0/visual-document.schema.json

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rfcs/0001-visual-document-v0.md schemas/v0/visual-document.schema.json
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git commit -m "style: format VisualDocument RFC and schema"
          git push origin HEAD:docs/visual-document-v0-rfc
