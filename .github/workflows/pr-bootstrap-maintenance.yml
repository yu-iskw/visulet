name: PR bootstrap maintenance

on:
  push:
    branches:
      - docs/rfc-0001-visual-document-v0

permissions:
  contents: write

jobs:
  format-and-lock:
    name: Refresh lockfile and format POC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true

      - name: Enable Corepack
        run: corepack enable

      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Apply ESLint safe fixes
        run: pnpm exec eslint packages/common --fix || true

      - name: Format changed implementation files
        run: >-
          pnpm exec prettier --write
          package.json
          pnpm-workspace.yaml
          packages/common
          README.md
          docs/rfcs/0001-visual-document-v0.md
          docs/rfcs/0001-adversarial-review.md
          examples/v0/quarterly-revenue.json
          schemas/v0/visual-document.schema.json
          benchmarks/agent-authoring/v0

      - name: Commit generated maintenance changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-workspace.yaml pnpm-lock.yaml packages README.md docs examples schemas benchmarks
          git commit -m "chore: refresh POC formatting and lockfile"
          git push
