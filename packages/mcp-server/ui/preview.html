<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Vizulet preview</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        display: grid;
        grid-template-columns: 1fr 20rem;
        min-height: 100vh;
      }
      main,
      aside {
        padding: 1rem;
      }
      aside {
        border-left: 1px solid #cbd5e1;
        overflow: auto;
      }
      pre {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Preview</h1>
      <div id="preview"></div>
    </main>
    <aside>
      <h2>Outline</h2>
      <pre id="outline"></pre>
      <h2>Diagnostics</h2>
      <pre id="diagnostics"></pre>
      <h2>Compatibility</h2>
      <pre id="capabilities"></pre>
      <h2>Patch</h2>
      <pre id="patch"></pre>
      <button id="apply-patch" type="button">Apply patch</button>
      <h2>JSON</h2>
      <pre id="json"></pre>
    </aside>
    <script>
      var currentDocument;
      var currentPatch;
      var rpcId = 1;
      function setText(id, value) {
        document.getElementById(id).textContent = typeof value === 'string' ? value : '';
      }
      function asString(value) {
        if (typeof value === 'string') {
          return value;
        }
        if (value === undefined) {
          return '';
        }
        return JSON.stringify(value, null, 2);
      }
      function setSvgPreview(svg) {
        var preview = document.getElementById('preview');
        preview.replaceChildren();
        if (typeof svg !== 'string' || svg.indexOf('<svg') === -1) {
          return;
        }
        var image = document.createElement('img');
        image.alt = 'Rendered visual';
        image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        preview.appendChild(image);
      }
      function applyUi(ui) {
        if (!ui) {
          return;
        }
        if (ui.svg) {
          setSvgPreview(ui.svg);
        }
        if (ui.outline) setText('outline', asString(ui.outline));
        if (ui.diagnostics) setText('diagnostics', asString(ui.diagnostics));
        if (ui.capabilities) setText('capabilities', asString(ui.capabilities));
        if (ui.patch) {
          setText('patch', asString(ui.patch));
          currentPatch = ui.patch;
        }
        if (ui.json) {
          setText('json', asString(ui.json));
          currentDocument = ui.json;
        }
        if (ui.document) {
          currentDocument = ui.document;
        }
      }
      function uiFromMcpContent(data) {
        var content = data.content;
        if (!content && data.result && data.result.content) {
          content = data.result.content;
        }
        if (!Array.isArray(content) || !content[0] || typeof content[0].text !== 'string') {
          return undefined;
        }
        try {
          var parsed = JSON.parse(content[0].text);
          var result = parsed.result || {};
          return {
            svg: result.svg,
            diagnostics: parsed.diagnostics,
            json: result.document,
            document: result.document,
            outline: result.outline ?? (Array.isArray(result.viewIds) ? result : undefined),
            capabilities: result.capabilities,
            patch: result.patch,
          };
        } catch {
          return undefined;
        }
      }
      function uiFromRpc(data) {
        if (!data) {
          return data;
        }
        var fromTool = uiFromMcpContent(data);
        if (fromTool) {
          return fromTool;
        }
        if (data.jsonrpc !== '2.0') {
          return data;
        }
        if (data.method === 'ui/update') {
          return data.params;
        }
        if (data.result && data.result.ui) {
          return data.result.ui;
        }
        return data.params || {};
      }
      window.addEventListener('message', function (event) {
        if (event.source !== window.parent) {
          return;
        }
        applyUi(uiFromRpc(event.data || {}));
      });
      document.getElementById('apply-patch').addEventListener('click', function () {
        window.parent.postMessage(
          {
            jsonrpc: '2.0',
            id: rpcId,
            method: 'tools/call',
            params: {
              name: 'visual_apply_patch',
              arguments: { document: currentDocument, patch: currentPatch },
            },
          },
          '*',
        );
        rpcId += 1;
      });
    </script>
  </body>
</html>
